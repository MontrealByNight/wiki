<!DOCTYPE html>
<html>
<head>
    <title>Montreal Map Editor (ST ONLY)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; border-bottom: 2px solid #444; }
        #output-panel { height: 280px; background: #2b2b2b; padding: 12px 15px; display: flex; flex-direction: column; box-sizing: border-box; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
        .toolbar h3 { margin: 0; color: #e67e22; }
        .toolbar p { margin: 0; font-size: 0.9em; color: #aaa; }
        select, button.copy-btn { background: #444; color: #fff; border: 1px solid #777; padding: 7px 12px; font-size: 14px; border-radius: 4px; cursor: pointer; }
        button.copy-btn:hover { background: #555; }
        button.copy-btn.copied { background: #2e7d32; border-color: #4caf50; }
        #codeBox { flex-grow: 1; background: #0f0f0f; color: #4caf50; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 13px; resize: none; }

        /* Dark Mode Popups & Inline Property Form */
        .leaflet-popup-content-wrapper { background: #2b2b2b; color: #e0e0e0; border: 1px solid #444; border-radius: 6px; }
        .leaflet-popup-tip { background: #2b2b2b; border: 1px solid #444; }
        .editor-form { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
        .editor-form label { font-size: 12px; color: #bbb; display: flex; flex-direction: column; gap: 3px; }
        .editor-form input, .editor-form select, .editor-form textarea {
            background: #1a1a1a; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 5px 7px; font-size: 13px; font-family: sans-serif;
        }
        .editor-form button {
            background: #e67e22; color: #fff; border: none; border-radius: 4px; padding: 6px 10px; font-weight: bold; cursor: pointer; margin-top: 2px;
        }
        .editor-form button:hover { background: #cf6d17; }
        .coord-readout { font-family: monospace; font-size: 12px; color: #90caf9; background: #1a1a1a; padding: 4px 6px; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="output-panel">
        <div class="toolbar">
            <h3>Code Generator</h3>
            <p>Use the Draw toolbar to add/edit shapes, or click any pin/zone to rename or change faction. Click <b>Save</b> on the toolbar to snap coordinates.</p>
            <select id="fileSelector" onchange="updateCodeBox()">
                <option value="polygons">polygons.js</option>
                <option value="camarilla">camarilla.js</option>
                <option value="anarch">anarch.js</option>
                <option value="contested">contested.js</option>
                <option value="markdown">➡️ Markdown Helper</option>
            </select>
            <button id="copyBtn" class="copy-btn" type="button" onclick="copyCode()">Copy Code</button>
        </div>
        <textarea id="codeBox" readonly></textarea>
    </div>

    <script src="data/camarilla.js"></script>
    <script src="data/anarch.js"></script>
    <script src="data/contested.js"></script>
    <script src="data/polygons.js"></script>

    <script>
        // --- 1. GLOBAL VARIABLES & BASEMAPS ---
        var generatedCodes = { polygons: "", camarilla: "", anarch: "", contested: "", markdown: "" };
        var SNAP_PRECISION = 4; // 4 decimal places (0.0001)

        var darkTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_4kwe_1_7f05808b21ede8140c2e7a6e', {
            attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 19
        });
        var lightTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_4kwe_1_7f05808b21ede8140c2e7a6e', {
            attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 19
        });
        var satelliteTheme = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 19
        });

        var map = L.map('map', {
            center: [45.53, -73.60],
            zoom: 11,
            layers: [darkTheme]
        });

        L.control.layers({
            "Dark Theme": darkTheme,
            "Light Theme": lightTheme,
            "Satellite View": satelliteTheme
        }, null, { position: 'topright' }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // --- 2. HELPER FUNCTIONS ---
        function getColor(type) {
            if (type === 'Camarilla') return '#e67e22'; // Orange
            if (type === 'Anarch') return '#206694';    // Blue
            if (type === 'Contested' || type === 'Hecata') return '#992d22'; // Dark Red
            return '#546e7a'; // Grey
        }

        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: '<div style="font-size: 24px; text-align: center; line-height: 30px;">' + emoji + '</div>',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        var icons = {
            'Camarilla': createEmojiIcon('🟠'),
            'Anarch': createEmojiIcon('🟣'),
            'Hecata': createEmojiIcon('👻'),
            'Contested': createEmojiIcon('🔴')
        };
        var defaultIcon = createEmojiIcon('📍');

        function getMarkerIcon(data, parsedEmoji) {
            var finalEmoji = (data && data.emoji) || parsedEmoji;
            return finalEmoji ? createEmojiIcon(finalEmoji) : (icons[data && data.type] || defaultIcon);
        }

        function snapLatLng(ll) {
            return L.latLng(
                parseFloat(ll.lat.toFixed(SNAP_PRECISION)),
                parseFloat(ll.lng.toFixed(SNAP_PRECISION))
            );
        }

        function snapLayer(layer) {
            if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
                layer.setLatLng(snapLatLng(layer.getLatLng()));
            } else if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
                var deepSnap = function(arr) {
                    return arr.map(function(item) {
                        return Array.isArray(item) ? deepSnap(item) : snapLatLng(item);
                    });
                };
                layer.setLatLngs(deepSnap(layer.getLatLngs()));
            }
        }

        // Build an interactive DOM popup for renaming / changing faction of any pin or polygon
        function buildEditorPopup(layer) {
            var isMarker = layer instanceof L.Marker;
            var data = layer.featureData || {};

            var container = document.createElement('div');
            container.className = 'editor-form';

            var nameLabel = document.createElement('label');
            nameLabel.textContent = isMarker ? 'Location Name' : 'Zone Name';
            var nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = data.name || '';
            nameLabel.appendChild(nameInput);
            container.appendChild(nameLabel);

            var typeLabel = document.createElement('label');
            typeLabel.textContent = 'Faction / Type';
            var typeSelect = document.createElement('select');
            var options = ['Camarilla', 'Anarch', 'Contested', 'Hecata', 'Other'];
            options.forEach(function(optVal) {
                var opt = document.createElement('option');
                opt.value = optVal;
                opt.textContent = optVal;
                if (data.type === optVal) opt.selected = true;
                typeSelect.appendChild(opt);
            });
            typeLabel.appendChild(typeSelect);
            container.appendChild(typeLabel);

            var descInput = null;
            if (!isMarker) {
                var descLabel = document.createElement('label');
                descLabel.textContent = 'Popup Description (optional)';
                descInput = document.createElement('textarea');
                descInput.rows = 2;
                descInput.value = data.desc || '';
                descLabel.appendChild(descInput);
                container.appendChild(descLabel);
            } else {
                var ll = layer.getLatLng();
                var coordBox = document.createElement('div');
                coordBox.className = 'coord-readout';
                coordBox.textContent = ll.lat.toFixed(SNAP_PRECISION) + ', ' + ll.lng.toFixed(SNAP_PRECISION);
                container.appendChild(coordBox);
            }

            var saveBtn = document.createElement('button');
            saveBtn.type = 'button';
            saveBtn.textContent = 'Apply Changes';
            saveBtn.addEventListener('click', function() {
                var trimmedName = nameInput.value.trim() || (isMarker ? 'NEW LOCATION' : 'NEW ZONE');
                data.name = trimmedName;
                data.type = typeSelect.value;

                if (isMarker) {
                    layer.setIcon(getMarkerIcon(data, layer.parsedEmoji));
                } else {
                    var trimmedDesc = descInput.value.trim();
                    if (trimmedDesc) {
                        data.desc = trimmedDesc;
                    } else {
                        delete data.desc;
                    }
                    var color = getColor(data.type);
                    layer.setStyle({ color: color, fillColor: color });
                }

                layer.featureData = data;
                generateCode();
                layer.closePopup();
            });
            container.appendChild(saveBtn);

            return container;
        }

        function attachEditorPopup(layer) {
            layer.bindPopup(function() {
                return buildEditorPopup(layer);
            }, { maxWidth: 300 });
        }

        // --- 3. DATA LOADING ---
        async function fetchMarkdownPins(dataArray, url) {
            if (!dataArray || dataArray.length === 0) return;
            try {
                const response = await fetch(url);
                const text = await response.text();

                dataArray.forEach(function(loc) {
                    var searchString = "* **" + loc.name + "**";
                    var startIndex = text.indexOf(searchString);
                    var pinLat = loc.lat;
                    var pinLng = loc.lng;
                    var parsedEmoji = null;

                    if (startIndex !== -1) {
                        var textAfterStart = text.substring(startIndex + searchString.length);
                        var stopMatch = textAfterStart.match(/\n(?:\*\s\*\*|##|---|\*\*\*)/);
                        var rawBlock = stopMatch ? textAfterStart.substring(0, stopMatch.index) : textAfterStart;

                        var coordsMatch = rawBlock.match(/\*\*Coordinates\*\*:\s*`?\s*([-\d.]+)\s*,\s*([-\d.]+)\s*`?/);
                        if (coordsMatch) {
                            pinLat = parseFloat(coordsMatch[1]);
                            pinLng = parseFloat(coordsMatch[2]);
                        }

                        var ownerMatch = rawBlock.match(/\*\*Currently Owned [Bb]y (?:[Tt]he )?(.*?)\s/);
                        if (ownerMatch && ownerMatch[1]) {
                            parsedEmoji = ownerMatch[1].trim();
                        }
                    }

                    if (pinLat && pinLng) {
                        var copyData = Object.assign({}, loc);
                        var layer = L.marker([pinLat, pinLng], { icon: getMarkerIcon(copyData, parsedEmoji) });
                        layer.featureData = copyData;
                        layer.parsedEmoji = parsedEmoji;
                        attachEditorPopup(layer);
                        drawnItems.addLayer(layer);
                    } else {
                        console.warn("Editor skipped '" + loc.name + "' - No coordinates found.");
                    }
                });
            } catch (err) {
                console.error("Failed to load markdown:", err);
            }
        }

        async function initializeMapData() {
            // Load Polygons first so markers sit above them
            if (typeof mapPolygons !== 'undefined') {
                mapPolygons.forEach(function(poly) {
                    var color = getColor(poly.type);
                    var layer = L.polygon(poly.coords, { color: color, fillColor: color, weight: 2, fillOpacity: 0.15 });
                    layer.featureData = Object.assign({}, poly);
                    attachEditorPopup(layer);
                    drawnItems.addLayer(layer);
                    layer.bringToBack();
                });
            }

            // Load Pins from Markdown
            await Promise.all([
                fetchMarkdownPins(typeof data_camarilla !== 'undefined' ? data_camarilla : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Camarilla%20Locations.md"),
                fetchMarkdownPins(typeof data_anarch !== 'undefined' ? data_anarch : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Anarch%20Locations.md"),
                fetchMarkdownPins(typeof data_contested !== 'undefined' ? data_contested : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Contested%20Locations.md")
            ]);

            generateCode();
        }

        // --- 4. DRAWING CONTROLS & EVENTS ---
        var drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems, remove: true },
            draw: { polyline: false, circle: false, circlemarker: false, rectangle: true, marker: true, polygon: true }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.EDITSTART, function () { map.closePopup(); });
        map.on(L.Draw.Event.DELETESTART, function () { map.closePopup(); });

        map.on(L.Draw.Event.CREATED, function (e) {
            var layer = e.layer;
            snapLayer(layer);

            if (layer instanceof L.Marker) {
                layer.featureData = { name: "NEW LOCATION", type: "Camarilla" };
                layer.parsedEmoji = null;
                layer.setIcon(getMarkerIcon(layer.featureData, null));
            } else if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                layer.featureData = { name: "NEW ZONE", type: "Contested" };
                var color = getColor("Contested");
                layer.setStyle({ color: color, fillColor: color, weight: 2, fillOpacity: 0.15 });
            }

            attachEditorPopup(layer);
            drawnItems.addLayer(layer);
            if (!(layer instanceof L.Marker)) {
                layer.bringToBack();
            }
            generateCode();
            layer.openPopup();
        });

        map.on(L.Draw.Event.EDITED, function (e) {
            e.layers.eachLayer(function(layer) {
                snapLayer(layer);
            });
            generateCode();
        });

        map.on(L.Draw.Event.DELETED, function () {
            generateCode();
        });

        // --- 5. CODE GENERATION ---
        function generateCode() {
            var outPolys = [], outCam = [], outAnarch = [], outCont = [], outMarkdown = [];

            drawnItems.eachLayer(function(layer) {
                var data = layer.featureData || {};
                var name = data.name || "UNNAMED";
                var type = data.type || "Other";

                if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                    var rawRings = layer.getLatLngs();
                    var latlngs = Array.isArray(rawRings[0]) ? rawRings[0] : rawRings;
                    if (Array.isArray(latlngs[0])) latlngs = latlngs[0];

                    var coords = latlngs.map(function(ll) {
                        return "[" + ll.lat.toFixed(SNAP_PRECISION) + ", " + ll.lng.toFixed(SNAP_PRECISION) + "]";
                    });
                    var descLine = data.desc ? ',\n    "desc": ' + JSON.stringify(data.desc) : "";
                    outPolys.push(
                        '  {\n    "name": ' + JSON.stringify(name) + ', "type": ' + JSON.stringify(type) + descLine + ',\n' +
                        '    "coords": [\n      ' + coords.join(",\n      ") + '\n    ]\n  }'
                    );
                } else if (layer instanceof L.Marker) {
                    var ll = layer.getLatLng();
                    var emojiStr = data.emoji ? ', "emoji": ' + JSON.stringify(data.emoji) : "";
                    var objStr = '  { "name": ' + JSON.stringify(name) + ', "type": ' + JSON.stringify(type) + emojiStr + ' }';

                    if (type === 'Camarilla') outCam.push(objStr);
                    else if (type === 'Anarch') outAnarch.push(objStr);
                    else outCont.push(objStr);

                    outMarkdown.push(
                        "<!-- " + name + " (" + type + ") -->\n" +
                        "  * **Coordinates**: `" + ll.lat.toFixed(SNAP_PRECISION) + ", " + ll.lng.toFixed(SNAP_PRECISION) + "`"
                    );
                }
            });

            generatedCodes.polygons = "var mapPolygons = [\n" + outPolys.join(",\n") + "\n];\n";
            generatedCodes.camarilla = "var data_camarilla = [\n" + outCam.join(",\n") + "\n];\n";
            generatedCodes.anarch = "var data_anarch = [\n" + outAnarch.join(",\n") + "\n];\n";
            generatedCodes.contested = "var data_contested = [\n" + outCont.join(",\n") + "\n];\n";
            generatedCodes.markdown = "<!-- Coordinates for Markdown files -->\n\n" + outMarkdown.join("\n\n") + "\n";

            updateCodeBox();
        }

        function updateCodeBox() {
            var sel = document.getElementById("fileSelector").value;
            document.getElementById("codeBox").value = generatedCodes[sel] || "";
        }

        function copyCode() {
            var box = document.getElementById("codeBox");
            var btn = document.getElementById("copyBtn");
            var showCopied = function() {
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.textContent = "Copy Code";
                    btn.classList.remove("copied");
                }, 1500);
            };
            var fallbackCopy = function() {
                box.select();
                document.execCommand("copy");
                showCopied();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(box.value).then(showCopied).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }
        }

        // --- 6. BOOT IT UP ---
        initializeMapData();
    </script>
</body>
</html>
