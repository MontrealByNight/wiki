<!DOCTYPE html>
<html>
<head>
    <title>Montreal Map Editor (ST ONLY)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; border-bottom: 2px solid #444; }
        #output-panel { height: 280px; background: #2b2b2b; padding: 15px; display: flex; flex-direction: column; }
        .toolbar { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
        select { background: #444; color: white; border: 1px solid #777; padding: 8px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        textarea { flex-grow: 1; background: #000; color: #00ff00; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 13px; resize: none; }
        h3 { margin: 0; color: #e67e22; }
        p { margin: 0; font-size: 0.9em; color: #aaa; }
        .leaflet-popup-content-wrapper { background: #2b2b2b; color: #e0e0e0; border: 1px solid #444; border-radius: 6px; }
        .leaflet-popup-tip { background: #2b2b2b; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="output-panel">
        <div class="toolbar">
            <h3>Code Generator</h3>
            <p>Use the Draw toolbar to edit. Click <b>Save</b> to snap and generate code.</p>
            <select id="fileSelector" onchange="updateCodeBox()">
                <option value="polygons">polygons.js</option>
                <option value="camarilla">camarilla.js</option>
                <option value="anarch">anarch.js</option>
                <option value="contested">contested.js</option>
                <option value="markdown">➡️ Markdown Helper</option>
            </select>
        </div>
        <textarea id="codeBox" readonly></textarea>
    </div>

    <script src="data/camarilla.js"></script>
    <script src="data/anarch.js"></script>
    <script src="data/contested.js"></script>
    <script src="data/polygons.js"></script>

    <script>
        // --- 1. GLOBAL VARIABLES & SETUP ---
        var generatedCodes = { polygons: "", camarilla: "", anarch: "", contested: "", markdown: "" };
        var SNAP_PRECISION = 4; // 4 decimal places (0.0001)

        var map = L.map('map', { center: [45.53, -73.60], zoom: 11 });
        var darkTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // --- 2. HELPER FUNCTIONS ---
        function getColor(type) {
            if (type === 'Camarilla') return '#e67e22'; 
            if (type === 'Anarch') return '#206694';    
            if (type === 'Contested' || type === 'Hecata') return '#992d22'; 
            return '#546e7a'; 
        }

        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: '<div style="font-size: 24px; text-align: center; line-height: 30px;">' + emoji + '</div>',
                className: '', iconSize: [30, 30], iconAnchor: [15, 15]
            });
        }
        var icons = { 'Camarilla': createEmojiIcon('🦇'), 'Anarch': createEmojiIcon('🔥'), 'Hecata': createEmojiIcon('💀'), 'Contested': createEmojiIcon('⚔️') };
        var defaultIcon = createEmojiIcon('📍');

        // Deep Snapping Function for Polygons
        function snapLatLng(ll) {
            return L.latLng(
                parseFloat(ll.lat.toFixed(SNAP_PRECISION)),
                parseFloat(ll.lng.toFixed(SNAP_PRECISION))
            );
        }

        function snapLayer(layer) {
            if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
                layer.setLatLng(snapLatLng(layer.getLatLng()));
            } else if (layer instanceof L.Polygon || layer instanceof L.Polyline) {
                const deepSnap = (arr) => arr.map(item => Array.isArray(item) ? deepSnap(item) : snapLatLng(item));
                layer.setLatLngs(deepSnap(layer.getLatLngs()));
            }
        }

        // --- 3. DATA LOADING ---
        async function fetchMarkdownPins(dataArray, url) {
            if (!dataArray || dataArray.length === 0) return;
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                dataArray.forEach(function(loc) {
                    var search = "**" + loc.name + "**";
                    var startIndex = text.indexOf(search);
                    var pinLat, pinLng;

                    if (startIndex !== -1) {
                        var rawBlock = text.substring(startIndex).split(/\n(?:\s*\*\s\*\*|##|---)/)[0];
                        var coordsMatch = rawBlock.match(/\*\*Coordinates\*\*:\s*`?\s*([-\d.]+)\s*,\s*([-\d.]+)\s*`?/);
                        if (coordsMatch) {
                            pinLat = parseFloat(coordsMatch[1]);
                            pinLng = parseFloat(coordsMatch[2]);
                        }
                    }

                    if (pinLat && pinLng) {
                        var layer = L.marker([pinLat, pinLng], { icon: loc.emoji ? createEmojiIcon(loc.emoji) : (icons[loc.type] || defaultIcon) });
                        layer.featureData = loc; // Attach metadata
                        layer.bindPopup(`<b>${loc.name}</b><br>${loc.type}`);
                        drawnItems.addLayer(layer);
                    }
                });
            } catch (err) { console.error("Failed to load markdown:", err); }
        }

        async function initializeMapData() {
            // Load Polygons
            if (typeof mapPolygons !== 'undefined') {
                mapPolygons.forEach(function(poly) {
                    var layer = L.polygon(poly.coords, { color: getColor(poly.type), weight: 2, fillOpacity: 0.15 });
                    layer.featureData = poly; // Attach metadata
                    layer.bindPopup(`<b>${poly.name}</b><br>${poly.type}`);
                    drawnItems.addLayer(layer);
                });
            }

            // Load Pins
            await Promise.all([
                fetchMarkdownPins(typeof data_camarilla !== 'undefined' ? data_camarilla : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Camarilla%20Locations.md"),
                fetchMarkdownPins(typeof data_anarch !== 'undefined' ? data_anarch : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Anarch%20Locations.md"),
                fetchMarkdownPins(typeof data_contested !== 'undefined' ? data_contested : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Contested%20Locations.md")
            ]);

            generateCode(); // Initial code generation
        }

        // --- 4. DRAWING CONTROLS & EVENTS ---
        var drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems, remove: true },
            draw: { polyline: false, circle: false, circlemarker: false, rectangle: true, marker: true, polygon: true }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (e) {
            var layer = e.layer;
            snapLayer(layer); // Snap immediately

            if (layer instanceof L.Marker) {
                layer.featureData = { name: "NEW LOCATION", type: "Camarilla" };
            } else if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                layer.featureData = { name: "NEW ZONE", type: "Contested" };
                layer.setStyle({ color: getColor("Contested") });
            }
            
            drawnItems.addLayer(layer);
            generateCode();
        });

        map.on(L.Draw.Event.EDITED, function (e) {
            e.layers.eachLayer(function(layer) {
                snapLayer(layer); // Snap everything that was edited
            });
            generateCode();
        });

        map.on(L.Draw.Event.DELETED, function () {
            generateCode();
        });

        // --- 5. CODE GENERATION ---
        function generateCode() {
            var outPolys = [], outCam = [], outAnarch = [], outCont = [], outMarkdown = [];

            drawnItems.eachLayer(function(layer) {
                var data = layer.featureData || {};
                var name = data.name || "UNNAMED";
                var type = data.type || "Other";

                if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                    var latlngs = layer.getLatLngs()[0]; // Extract primary ring
                    // Ensure it is a flat array of LatLngs
                    if (Array.isArray(latlngs) && Array.isArray(latlngs[0])) latlngs = latlngs[0];

                    var coords = latlngs.map(ll => `[${ll.lat.toFixed(SNAP_PRECISION)}, ${ll.lng.toFixed(SNAP_PRECISION)}]`);
                    outPolys.push(`  {\n    "name": "${name}", "type": "${type}",\n    "coords": [\n      ${coords.join(",\n      ")}\n    ]\n  }`);
                } 
                else if (layer instanceof L.Marker) {
                    var ll = layer.getLatLng();
                    var emojiStr = data.emoji ? `, "emoji": "${data.emoji}"` : "";
                    var objStr = `  { "name": "${name}", "type": "${type}"${emojiStr} }`;

                    if (type === 'Camarilla') outCam.push(objStr);
                    else if (type === 'Anarch') outAnarch.push(objStr);
                    else outCont.push(objStr);

                    outMarkdown.push(`* **Coordinates**: \`${ll.lat.toFixed(SNAP_PRECISION)}, ${ll.lng.toFixed(SNAP_PRECISION)}\`  `);
                }
            });

            generatedCodes.polygons = "var mapPolygons = [\n" + outPolys.join(",\n") + "\n];";
            generatedCodes.camarilla = "var data_camarilla = [\n" + outCam.join(",\n") + "\n];";
            generatedCodes.anarch = "var data_anarch = [\n" + outAnarch.join(",\n") + "\n];";
            generatedCodes.contested = "var data_contested = [\n" + outCont.join(",\n") + "\n];";
            generatedCodes.markdown = "/* Coordinates for Markdown files */\n\n" + outMarkdown.join("\n");

            updateCodeBox();
        }

        function updateCodeBox() {
            var sel = document.getElementById("fileSelector").value;
            document.getElementById("codeBox").value = generatedCodes[sel] || "";
        }

        // --- 6. BOOT IT UP ---
        initializeMapData();

    </script>
</body>
</html>
