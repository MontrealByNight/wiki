<!DOCTYPE html>
<html>
<head>
    <title>Montreal Map Editor (ST ONLY)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; border-bottom: 2px solid #444; }
        #output-panel { height: 280px; background: #2b2b2b; padding: 15px; display: flex; flex-direction: column; }
        .toolbar { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
        select { background: #444; color: white; border: 1px solid #777; padding: 8px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        textarea { flex-grow: 1; background: #000; color: #00ff00; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 13px; resize: none; }
        h3 { margin: 0; color: #e67e22; }
        p { margin: 0; font-size: 0.9em; color: #aaa; }
        
        /* Custom Dark Mode Popups */
        .leaflet-popup-content-wrapper { background: #2b2b2b; color: #e0e0e0; border: 1px solid #444; border-radius: 6px; }
        .leaflet-popup-tip { background: #2b2b2b; border: 1px solid #444; }
        .leaflet-popup-content b { color: #e67e22; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="output-panel">
        <div class="toolbar">
            <h3>Code Generator</h3>
            <p>Make a change on the map, select the file you want to update, and copy the code.</p>
            <select id="fileSelector" onchange="updateCodeBox()">
                <option value="polygons">polygons.js</option>
                <option value="camarilla">camarilla.js</option>
                <option value="anarch">anarch.js</option>
                <option value="contested">contested.js</option>
                <option value="markdown">➡️ Markdown Helper (Coordinates)</option>
            </select>
        </div>
        <textarea id="codeBox" readonly></textarea>
    </div>

    <script src="data/camarilla.js"></script>
    <script src="data/anarch.js"></script>
    <script src="data/contested.js"></script>
    <script src="data/polygons.js"></script>

    <script>
        var generatedCodes = { polygons: "", camarilla: "", anarch: "", contested: "", markdown: "" };

        // 1. Basemaps
        var darkTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
        var lightTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
        var satelliteTheme = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

        var map = L.map('map', { center: [45.53, -73.60], zoom: 11, layers: [darkTheme] });
        L.control.layers({ "Dark Theme": darkTheme, "Light Theme": lightTheme, "Satellite View": satelliteTheme }, null, { position: 'topright' }).addTo(map);

        // 2. Colors & Icons
        function getColor(type) {
            if (type === 'Camarilla') return '#e67e22'; 
            if (type === 'Anarch') return '#206694';    
            if (type === 'Contested' || type === 'Hecata') return '#992d22'; 
            return '#546e7a'; 
        }

        var iconSize = [30, 30], iconAnchor = [15, 15]; 
        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: '<div style="font-size: 24px; text-align: center; line-height: 30px;">' + emoji + '</div>',
                className: '', iconSize: iconSize, iconAnchor: iconAnchor
            });
        }
        var icons = { 'Camarilla': createEmojiIcon('🦇'), 'Anarch': createEmojiIcon('🔥'), 'Hecata': createEmojiIcon('💀'), 'Contested': createEmojiIcon('⚔️') };
        var defaultIcon = createEmojiIcon('📍');

        // 3. The Editable Layer
        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // 4. Async Fetcher (Loads Pins from Markdown into the Editor)
        async function fetchAndDrawForEditor(dataArray, rawMarkdownUrl) {
            if (!dataArray || dataArray.length === 0) return;
            let markdownText = "";
            try {
                const response = await fetch(rawMarkdownUrl);
                markdownText = await response.text();
            } catch (error) { console.error("Could not load Markdown.", error); return; }

            dataArray.forEach(function(loc) {
                var searchString = "* **" + loc.name + "**";
                var startIndex = markdownText.indexOf(searchString);
                var pinLat, pinLng;

                if (startIndex !== -1) {
                    var textAfterStart = markdownText.substring(startIndex + searchString.length);
                    var stopMatch = textAfterStart.match(/\n(?:\*\s\*\*|##|---)/);
                    var rawBlock = stopMatch ? textAfterStart.substring(0, stopMatch.index) : textAfterStart;

                    var coordsMatch = rawBlock.match(/\*\*Coordinates\*\*:\s*`\s*([-\d.]+)\s*,\s*([-\d.]+)\s*`/);
                    if (coordsMatch) { pinLat = parseFloat(coordsMatch[1]); pinLng = parseFloat(coordsMatch[2]); }
                }

                if (pinLat && pinLng) {
                    var markerIcon = loc.emoji ? createEmojiIcon(loc.emoji) : (icons[loc.type] || defaultIcon);
                    var layer = L.marker([pinLat, pinLng], { icon: markerIcon });
                    layer.featureData = loc; 
                    layer.dataType = 'marker';
                    
                    var coordString = "* **Coordinates**: `" + pinLat.toFixed(6) + ", " + pinLng.toFixed(6) + "`";
                    layer.bindPopup("<b>" + loc.name + "</b><br><i>" + loc.type + "</i><br><br><textarea style='width:100%; height:35px; background:#111; color:#fff;' readonly>" + coordString + "</textarea>");
                    drawnItems.addLayer(layer);
                }
            });
        }

        // 5. Initialize Everything
        async function initializeEditor() {
            // Load Polygons
            if (typeof mapPolygons !== 'undefined') {
                mapPolygons.forEach(function(poly) {
                    var zoneColor = getColor(poly.type);
                    var layer = L.polygon(poly.coords, { color: zoneColor, weight: 2, fillColor: zoneColor, fillOpacity: 0.15 });
                    layer.featureData = poly; layer.dataType = 'polygon';
                    layer.bindPopup("<b>" + poly.name + "</b><br>Shape Layer");
                    drawnItems.addLayer(layer);
                });
            }

            // Await all Markdown pins before generating controls
            await Promise.all([
                fetchAndDrawForEditor(typeof data_camarilla !== 'undefined' ? data_camarilla : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Camarilla%20Locations.md"),
                fetchAndDrawForEditor(typeof data_anarch !== 'undefined' ? data_anarch : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Anarch%20Locations.md"),
                fetchAndDrawForEditor(typeof data_contested !== 'undefined' ? data_contested : [], "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Contested%20Locations.md")
            ]);

            // Add Editing Tools
            var drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems, remove: true },
                draw: { polyline: false, circle: false, circlemarker: false, rectangle: true, marker: true, polygon: true }
            });
            map.addControl(drawControl);

            // Listeners
            map.on(L.Draw.Event.CREATED, function (e) { 
                var layer = e.layer;
                if (layer instanceof L.Marker) { 
                    layer.dataType = 'marker'; 
                    layer.featureData = { name: "NEW LOCATION", type: "Camarilla" }; 
                    layer.bindPopup("<b>New Marker</b><br>Edit the JS array to finalize name and type."); 
                }
                else if (layer instanceof L.Polygon || layer instanceof L.Rectangle) { 
                    layer.dataType = 'polygon'; 
                    layer.featureData = { name: "NEW ZONE", type: "Contested" }; 
                }
                drawnItems.addLayer(layer); 
                generateCode(); 
            });
            map.on(L.Draw.Event.EDITED, function () { generateCode(); });
            map.on(L.Draw.Event.DELETED, function () { generateCode(); });

            generateCode();
        }

        // 6. Generate the Cleaned Arrays
        function generateCode() {
            var outPolys = [], outCam = [], outAnarch = [], outCont = [], outMarkdown = [];

            drawnItems.eachLayer(function(layer) {
                if (layer.dataType === 'polygon' || layer instanceof L.Polygon) {
                    var coords = layer.getLatLngs()[0].map(ll => `[${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}]`);
                    var name = layer.featureData ? layer.featureData.name : "NEW ZONE";
                    var type = layer.featureData ? layer.featureData.type : "Contested";
                    outPolys.push(`  {\n    "name": "${name}", "type": "${type}",\n    "coords": [\n      ${coords.join(",\n      ")}\n    ]\n  }`);
                } 
                else if (layer.dataType === 'marker' || layer instanceof L.Marker) {
                    var ll = layer.getLatLng();
                    var name = layer.featureData ? layer.featureData.name : "NEW LOCATION";
                    var type = layer.featureData ? layer.featureData.type : "Camarilla";
                    var emojiStr = (layer.featureData && layer.featureData.emoji) ? `, "emoji": "${layer.featureData.emoji}"` : "";
                    
                    var objStr = `  { "name": "${name}", "type": "${type}"${emojiStr} }`;

                    if (type === 'Camarilla') outCam.push(objStr);
                    else if (type === 'Anarch') outAnarch.push(objStr);
                    else outCont.push(objStr);

                    // Add to Markdown Helper List
                    outMarkdown.push(`* **Coordinates**: \`${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}\`  `);
                }
            });

            generatedCodes.polygons = "var mapPolygons = [\n" + outPolys.join(",\n") + "\n];";
            generatedCodes.camarilla = "var data_camarilla = [\n" + outCam.join(",\n") + "\n];";
            generatedCodes.anarch = "var data_anarch = [\n" + outAnarch.join(",\n") + "\n];";
            generatedCodes.contested = "var data_contested = [\n" + outCont.join(",\n") + "\n];";
            generatedCodes.markdown = "/* Copy the coordinate lines below directly into your GitBook Markdown files! */\n\n" + outMarkdown.join("\n");

            updateCodeBox();
        }

        function updateCodeBox() {
            document.getElementById("codeBox").value = generatedCodes[document.getElementById("fileSelector").value];
        }

        // Boot it up
        initializeEditor();

    </script>
</body>
</html>
