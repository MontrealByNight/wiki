<!DOCTYPE html>
<html>
<head>
    <title>Montreal By Night Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        /* Custom Dark Mode Popups */
        .leaflet-popup-content-wrapper { background: #2b2b2b; color: #e0e0e0; border: 1px solid #444; border-radius: 6px; }
        .leaflet-popup-tip { background: #2b2b2b; border: 1px solid #444; }
        .leaflet-popup-content b { color: #e67e22; font-size: 1.1em; }
        .leaflet-popup-content img { border-radius: 4px; margin-top: 8px; margin-bottom: 8px; }
        .leaflet-popup-content a { color: #5dade2; text-decoration: none; }
        .leaflet-popup-content a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="data/camarilla.js"></script>
    <script src="data/polygons.js"></script>

    <script>
        // 1. Define your Themes (Basemaps)
        var darkTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 19
        });
        var lightTheme = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO', subdomains: 'abcd', maxZoom: 19
        });
        var satelliteTheme = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 19
        });

        // 2. Initialize the Map
        var map = L.map('map', {
            center: [45.53, -73.60],
            zoom: 11,
            layers: [darkTheme] // Sets Dark Theme as the default on load
        });

        // 3. Create the Empty Overlay Groups (These are the checkboxes!)
        var territoryLayer = L.layerGroup().addTo(map);
        var camarillaLayer = L.layerGroup().addTo(map);
        var anarchLayer = L.layerGroup().addTo(map);
        var contestedLayer = L.layerGroup().addTo(map);

        // 4. Define Colors
        function getColor(type) {
            if (type === 'Camarilla') return '#e67e22'; // Orange
            if (type === 'Anarch') return '#206694';    // Blue
            if (type === 'Contested' || type === 'Hecata') return '#992d22'; // Dark Red
            return '#546e7a'; // Grey
        }

        // 5. Draw Polygons into the Territory Layer
        if (typeof mapPolygons !== 'undefined') {
            mapPolygons.forEach(function(poly) {
                var zoneColor = getColor(poly.type);
                
                // Build the popup content
                var popupContent = "<b>" + poly.name + "</b><br><i>" + poly.type + " Territory</i>";
                if (poly.desc) {
                    popupContent += "<br><br>" + poly.desc; // Adds the description if it exists
                }

                L.polygon(poly.coords, {
                    color: zoneColor, weight: 2, fillColor: zoneColor, fillOpacity: 0.15
                })
                .bindPopup(popupContent)
                .addTo(territoryLayer);
            });
        }

        // 6. Define Custom Emoji Icons using L.divIcon
        var iconSize = [30, 30]; 
        var iconAnchor = [15, 15]; 

        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: '<div style="font-size: 24px; text-align: center; line-height: 30px;">' + emoji + '</div>',
                className: '', 
                iconSize: iconSize,
                iconAnchor: iconAnchor
            });
        }

        var icons = {
            'Camarilla': createEmojiIcon('🦇'), 
            'Anarch': createEmojiIcon('🔥'), 
            'Hecata': createEmojiIcon('💀'), 
            'Contested': createEmojiIcon('⚔️')  
        };
        var defaultIcon = createEmojiIcon('📍'); 

        // 7. Automated Markdown Fetcher and Pin Drawer (With Auto-Coordinates!)
        async function fetchDescriptionsAndDraw(dataArray, targetLayer, rawMarkdownUrl) {
            if (typeof dataArray === 'undefined' || dataArray.length === 0) return;

            let markdownText = "";
            try {
                // Download the raw text
                const response = await fetch(rawMarkdownUrl);
                markdownText = await response.text();
            } catch (error) {
                console.error("Could not load Markdown file:", error);
                return;
            }

            dataArray.forEach(function(loc) {
                var markerIcon = loc.emoji ? createEmojiIcon(loc.emoji) : (icons[loc.type] || defaultIcon);
                
                // Find this location in the markdown text
                var searchString = "* **" + loc.name + "**";
                var startIndex = markdownText.indexOf(searchString);

                if (startIndex !== -1) {
                    var textAfterStart = markdownText.substring(startIndex + searchString.length);
                    var endIndex = textAfterStart.indexOf("\n* **"); 
                    var rawBlock = endIndex !== -1 ? textAfterStart.substring(0, endIndex) : textAfterStart;

                    // 1. EXTRACT COORDINATES
                    var coordsMatch = rawBlock.match(/\*\*Coordinates\*\*:\s*`\s*([-\d.]+)\s*,\s*([-\d.]+)\s*`/);
                    var pinLat, pinLng;

                    if (coordsMatch) {
                        pinLat = parseFloat(coordsMatch[1]);
                        pinLng = parseFloat(coordsMatch[2]);
                    } else if (loc.lat && loc.lng) {
                        pinLat = loc.lat;
                        pinLng = loc.lng;
                    }

                    // 2. CLEAN UP HTML
                    rawBlock = rawBlock.replace(/\n\s*\*\s\*\*Coordinates\*\*.*?(?=\n|$)/g, ''); // Hide coordinates from popup

                    var descriptionHTML = rawBlock
                        .replace(/^:\s*/, '') // Remove leading colon
                        .replace(/\n\s*\*\s\*\*(.*?)\*\*:/g, '<br><b>$1:</b>') 
                        .replace(/\n\s*\*\s↪\s\*\*(.*?)\*\*:/g, '<br>↳ <b>$1:</b>') 
                        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') 
                        .replace(/\n/g, '<br>'); 

                    // 3. DRAW THE PIN
                    if (pinLat && pinLng) {
                        L.marker([pinLat, pinLng], { icon: markerIcon })
                        .bindPopup("<b>" + loc.name + "</b><br><br>" + descriptionHTML, { maxWidth: 400, minWidth: 250 })
                        .addTo(targetLayer);
                    } else {
                        console.warn("Skipped '" + loc.name + "' - No coordinates found.");
                    }
                } else {
                    console.warn("Skipped '" + loc.name + "' - Could not find a matching name in the Markdown file.");
                }
            });
        }

        // 8. EXECUTE THE AUTOMATED SCRIPT! 
        // Note: I am using 'main' branch here. If your branch is 'master', change the URLs below!
        var camarillaUrl = "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Camarilla%20Locations.md";
        fetchDescriptionsAndDraw(typeof data_camarilla !== 'undefined' ? data_camarilla : [], camarillaLayer, camarillaUrl);

        // (We will uncomment the Anarch one once you format the Anarch Locations.md file!)
        // var anarchUrl = "https://raw.githubusercontent.com/montrealbynight/wiki/main/locations/Anarch%20Locations.md";
        // fetchDescriptionsAndDraw(typeof data_anarch !== 'undefined' ? data_anarch : [], anarchLayer, anarchUrl);


        // 9. Create the Unified Menu
        var baseMaps = {
            "Dark Theme": darkTheme,
            "Light Theme": lightTheme,
            "Satellite View": satelliteTheme
        };

        var overlayMaps = {
            "Territories": territoryLayer,
            "Camarilla Pins": camarillaLayer,
            "Anarch Pins": anarchLayer,
            "Contested/Other Pins": contestedLayer
        };

        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);
    </script>
